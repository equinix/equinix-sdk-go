name: Onboard new APIs from catalog

# Finds APIs in the Equinix API catalog (RFC 9727, https://docs.equinix.com/.well-known/api-catalog)
# that are not yet in the SDK, then onboards each one in a parallel job that opens its own PR.

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    name: Find APIs missing from the SDK
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.find.outputs.apis }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare API catalog with SDK
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        # No Marketplace action fits: the job fetches the catalog, validates names, and checks repo files and open PRs.
        # The logic lives in a script (not inline) so that it can run and be tested locally.
        run: echo "apis=$(script/find_missing_apis.sh)" >> "$GITHUB_OUTPUT"

  onboard:
    name: Onboard ${{ matrix.api.name }}
    needs: discover
    if: ${{ needs.discover.outputs.apis != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.discover.outputs.apis) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Onboard service and generate code
        id: onboard
        # Keep going on failure so that a draft PR is opened for someone to fix up
        # (e.g. by adding spec patches or custom templates), as the sync workflows do.
        continue-on-error: true
        env:
          API_NAME: ${{ matrix.api.name }}
          API_SPEC_URL: ${{ matrix.api.spec_url }}
        # script/onboard_service.sh is interactive; it reads the service name and spec URL from stdin.
        run: printf '%s\n%s\n' "$API_NAME" "$API_SPEC_URL" | script/onboard_service.sh
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Fixed branch name: discovery skips APIs with an open PR on this branch,
          # so manual fixes to a draft PR are never overwritten.
          branch: onboard/${{ matrix.api.name }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "feat: onboard ${{ matrix.api.name }} API"
          title: "feat: onboard ${{ matrix.api.name }} API"
          body: |
            Automatically onboards the `${{ matrix.api.name }}` API from the [Equinix API catalog](https://docs.equinix.com/.well-known/api-catalog).

            * Spec URL: ${{ matrix.api.spec_url }}
            * Added `Makefile.${{ matrix.api.name }}` and a sync workflow via `script/onboard_service.sh`
            * Fetched the spec and generated the client in `services/${{ matrix.api.name }}`

            Triggered by [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          delete-branch: true
          draft: ${{ steps.onboard.outcome == 'failure' }}
      - name: Comment for failed onboarding
        if: ${{ steps.onboard.outcome == 'failure' && steps.cpr.outputs.pull-request-number != '' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          issue: ${{ steps.cpr.outputs.pull-request-number }}
          message: Failed to fetch the spec or generate code for this API.  Someone with write access must fix this PR manually (see DEVELOPMENT.md for patching specs and custom templates) and then convert it from Draft status to Ready for Review.
      - name: Fail job if onboarding failed
        if: ${{ steps.onboard.outcome == 'failure' }}
        env:
          API_NAME: ${{ matrix.api.name }}
        run: |
          echo "::error::Onboarding ${API_NAME} failed. A draft PR was opened for manual follow-up."
          exit 1
