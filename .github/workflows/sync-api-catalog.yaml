name: Sync SDK with API catalog

# Compares the Equinix API catalog (RFC 9727, https://docs.equinix.com/.well-known/api-catalog)
# with the SDK. In parallel jobs, it onboards each API that is missing from the SDK and
# syncs each API that is in both. Each job opens its own PR when there is something to commit.
# APIs that are only in the SDK are reported but never removed.

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    name: Compare API catalog with SDK
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.plan.outputs.apis }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plan onboarding and sync work
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        # No Marketplace action fits: the job fetches the catalog, validates names, and checks repo files and open PRs.
        # The logic lives in a script (not inline) so that it can run and be tested locally.
        run: echo "apis=$(script/plan_catalog_sync.sh)" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.api.action }} ${{ matrix.api.name }}
    needs: discover
    if: ${{ needs.discover.outputs.apis != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.discover.outputs.apis) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Configure git user
        run: |
          # https://api.github.com/users/github-actions[bot]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Create service scaffolding
        id: scaffold
        if: ${{ matrix.api.action == 'onboard' }}
        env:
          API_NAME: ${{ matrix.api.name }}
          API_SPEC_URL: ${{ matrix.api.spec_url }}
          SKIP_GENERATE: '1'
        # A failure here stops the job. There is nothing useful to put in a draft PR.
        run: |
          script/onboard_service.sh "$API_NAME" "$API_SPEC_URL"
          git add "Makefile.${API_NAME}" "spec/services/${API_NAME}" "templates/services/${API_NAME}" "patches/services/${API_NAME}"
          git commit -m "onboard: add scaffolding for ${API_NAME}"
      # The next three steps run the same make targets that the old per-service sync
      # workflows ran. Each target has its own step and its own commit, so that the PR comment
      # says what failed and the PR history shows what each step changed.
      # A failed patch or generate step does not stop the job. A draft PR is opened for
      # someone to fix up (for example by adding spec patches or custom templates).
      - name: Fetch latest spec
        id: fetch
        env:
          API_NAME: ${{ matrix.api.name }}
        run: |
          make -f "Makefile.${API_NAME}" fetch
          git add "spec/services/${API_NAME}"
          git diff --cached --quiet || git commit -m "sync: fetch ${API_NAME} spec"
      - name: Apply spec patches
        id: patch
        if: ${{ always() && steps.fetch.conclusion == 'success' }}
        continue-on-error: true
        env:
          API_NAME: ${{ matrix.api.name }}
        run: |
          make -f "Makefile.${API_NAME}" patch
          git add "spec/services/${API_NAME}"
          git diff --cached --quiet || git commit -m "sync: patch ${API_NAME} spec"
      - name: Generate code
        id: generate
        if: ${{ always() && steps.fetch.conclusion == 'success' }}
        continue-on-error: true
        env:
          API_NAME: ${{ matrix.api.name }}
        run: |
          make -f "Makefile.${API_NAME}" generate
          git add "services/${API_NAME}"
          git diff --cached --quiet || git commit -m "sync: generate ${API_NAME} client"
      - name: Create Pull Request
        id: cpr
        if: ${{ always() && steps.fetch.conclusion == 'success' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Fixed branch name: discovery skips APIs with an open PR on this branch,
          # so manual fixes to a draft PR are never overwritten.
          branch: ${{ matrix.api.branch }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "sync: uncommitted changes detected when opening PR"
          title: ${{ matrix.api.title }}
          body: |
            Automatically ${{ matrix.api.action == 'onboard' && 'onboards' || 'syncs' }} the `${{ matrix.api.name }}` API with the [Equinix API catalog](https://docs.equinix.com/.well-known/api-catalog).

            * Spec URL: ${{ matrix.api.spec_url }}
            * ${{ matrix.api.action == 'onboard' && format('Added `Makefile.{0}` via `script/onboard_service.sh`', matrix.api.name) || 'Fetched the latest spec and applied the spec patches' }}
            * Generated the client in `services/${{ matrix.api.name }}`

            Triggered by [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          delete-branch: true
          draft: ${{ steps.patch.outcome == 'failure' || steps.generate.outcome == 'failure' }}
      - name: Comment for failed patch
        if: ${{ always() && steps.patch.outcome == 'failure' && steps.cpr.outputs.pull-request-number != '' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          issue: ${{ steps.cpr.outputs.pull-request-number }}
          message: Failed to patch the latest spec.  Someone with write access must review and, if necessary, fix this PR manually (see DEVELOPMENT.md for patching specs) and then convert it from Draft status to Ready for Review.
      - name: Comment for failed generate
        if: ${{ always() && steps.generate.outcome == 'failure' && steps.cpr.outputs.pull-request-number != '' }}
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3
        with:
          issue: ${{ steps.cpr.outputs.pull-request-number }}
          message: Failed to generate code from the latest patched spec.  Someone with write access must fix this PR manually (see DEVELOPMENT.md for custom templates and output patches) and then convert it from Draft status to Ready for Review.
      - name: Fail job if update failed
        if: ${{ always() && (steps.patch.outcome == 'failure' || steps.generate.outcome == 'failure') }}
        env:
          API_NAME: ${{ matrix.api.name }}
        run: |
          echo "::error::Updating ${API_NAME} failed. A draft PR was opened for manual follow-up."
          exit 1
